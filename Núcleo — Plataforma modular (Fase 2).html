        const mine = m.from === me.userId, hm = `${pad(t.getHours())}:${pad(t.getMinutes())}`;
        const st = mine ? `<span class="tick" title="${STATUS_LABEL[m.status]}" aria-label="${STATUS_LABEL[m.status]}">${STATUS_ICON[m.status] || ''}</span>` : '';
        html += `<div class="bubble${mine ? ' me' : ''}"${mine && m.status === 'failed' ? ` data-retry="${esc(m.id)}" role="button" tabindex="0"` : ''}>${esc(m.body)}<div class="st ${m.status}">${hm}${st}</div></div>`;
        if (mine && m.status === 'failed') html += `<small class="fail-note">${STATUS_LABEL.failed}${m.error ? ' (' + esc(m.error) + ')' : ''}</small>`;
      }
      log.innerHTML = html || '<div class="empty"><p>Nenhuma mensagem ainda.</p><p>Escreva abaixo para começar.</p></div>';
      if (msgs.length !== count) { count = msgs.length; window.scrollTo(0, document.documentElement.scrollHeight); }
      if (msgs.some(m => m.from === peerId && m.status === 'received')) await Messenger.markConversationRead(peerId);
    };
    const ta = $('#msg'), btn = $('#sendBtn');
    const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; btn.disabled = !ta.value.trim() || !contact; };
    ta.addEventListener('input', grow);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer: fine)').matches) { e.preventDefault(); if (!btn.disabled) $('#comp').requestSubmit(); }
    });
    $('#comp').addEventListener('submit', async e => {
      e.preventDefault();
      const body = ta.value.trim(); if (!body || !contact) return;
      ta.value = ''; grow();
      await Messenger.send(peerId, body); ta.focus();
    });
    $('#log').addEventListener('click', e => { const b = e.target.closest('[data-retry]'); if (b) Messenger.retry(b.dataset.retry); });
    $('#log').addEventListener('keydown', e => { const b = e.target.closest('[data-retry]'); if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); Messenger.retry(b.dataset.retry); } });
    this.listen('sync', render); this.listen('messages', render); this.listen('conn', render);
    await render();
  },

  /* Painel de teste [PROTÓTIPO]: age "como" outras pessoas */
  async testPanel(view) {
    Topbar.setTitle('Painel de teste'); Topbar.back = '#/messages';
    if (Backend.mode !== 'sim') { view.innerHTML = '<div class="empty"><p>O modo de teste está desligado.</p><p>Ligue em Status do sistema.</p></div>'; return; }
    const me = Identity.profile;
    view.innerHTML = '<div class="pad" id="tp"></div>';
    const tp = $('#tp');
    const render = async () => {
      const users = await SimServer.test.list();
      const [rs, ms] = await Promise.all([DB.all('sim_requests'), DB.all('sim_messages')]);
      tp.innerHTML = `<div class="sim-banner">Simulador ${tag('proto')} Os usuários abaixo existem só neste aparelho, para você testar os fluxos sem servidor. Nada sai para a internet.</div>
        <section class="panel" style="margin-top:0"><div class="switch-row"><span>Simular sem internet no seu aparelho</span>
          <button class="switch" role="switch" data-t="offline" aria-checked="${Connection.simOffline}" aria-label="Simular sem internet"></button></div>
          <p class="muted small" style="margin:0">Ligado, suas mensagens ficam pendentes. Ao desligar, elas saem sozinhas, sem duplicar.</p></section>
        <form class="inline-form" id="newTest"><input name="name" placeholder="Nome de um usuário de teste" maxlength="30"><button class="btn sm primary">Criar</button></form>
        <h3 class="sec">Usuários de teste</h3>
        ${users.length ? users.map(u => {
          const toMe = rs.find(r => r.fromId === u.id && r.toId === me.userId && r.status === 'pending');
          const fromMe = rs.find(r => r.fromId === me.userId && r.toId === u.id && r.status === 'pending');
          const isContact = rs.some(r => r.status === 'accepted' && ((r.fromId === u.id && r.toId === me.userId) || (r.toId === u.id && r.fromId === me.userId)));
          const waiting = ms.filter(m => m.to === u.id && !m.deliveredAt).length;
          const unread = ms.filter(m => m.to === u.id && m.deliveredAt && !m.readAt).length;
          const state = isContact ? 'É seu contato' : fromMe ? 'Recebeu sua solicitação' : toMe ? 'Pediu para te adicionar' : 'Ainda não conectado';
          return `<div class="test-user"><div style="display:flex;gap:12px;align-items:center">${avatar(u)}
            <div class="grow"><b>${esc(u.name)}</b> <span class="handle">#${esc(u.number)}</span><br>
            <small class="muted">${state}${waiting ? `, com ${waiting} mensagem(ns) guardada(s) no servidor` : ''}</small></div></div>
            <div class="btn-row">
              ${fromMe ? `<button class="btn sm primary" data-t="accept" data-id="${esc(fromMe.id)}" data-u="${esc(u.id)}">Aceitar como ${esc(u.name)}</button><button class="btn sm" data-t="decline" data-id="${esc(fromMe.id)}" data-u="${esc(u.id)}">Recusar</button>` : ''}
              ${!isContact && !fromMe && !toMe ? `<button class="btn sm" data-t="request" data-u="${esc(u.id)}">Enviar solicitação para mim</button>` : ''}
              ${waiting ? `<button class="btn sm" data-t="online" data-u="${esc(u.id)}">Ficar online e receber</button>` : ''}
              ${unread ? `<button class="btn sm" data-t="read" data-u="${esc(u.id)}">Ler suas mensagens</button>` : ''}
            </div>
            ${isContact ? `<form class="inline-form" data-reply="${esc(u.id)}"><input name="body" placeholder="Responder como ${esc(u.name)}" maxlength="500"><button class="btn sm">Enviar</button></form>` : ''}
          </div>`;
        }).join('') : '<p class="muted">Crie um usuário de teste para simular outra pessoa.</p>'}
        <button class="btn danger" data-t="reset" style="width:100%;margin-top:12px">Apagar todos os dados de teste</button>`;
    };
    tp.addEventListener('click', async e => {
      const b = e.target.closest('button[data-t]'); if (!b) return;
      const t = b.dataset.t, u = b.dataset.u;
      try {
        if (t === 'offline') { Connection.simOffline = !Connection.simOffline; Bus.emit('conn'); }
        else if (t === 'accept' || t === 'decline') await SimServer.respond(b.dataset.id, u, t === 'accept');
        else if (t === 'request') { await Sync.ensureRegistered(); await SimServer.sendRequest(u, me.userId); toast('Solicitação criada. Veja em Mensagens, Pedidos.'); }
        else if (t === 'online') await SimServer.pull(u);
        else if (t === 'read') await SimServer.markRead(u, me.userId);
        else if (t === 'reset') {
          if (!(await confirmSheet('Apagar dados de teste?', 'Remove usuários de teste, contatos, solicitações e mensagens. Notas e calendário não são afetados.'))) return;
          await SimServer.test.reset(); toast('Dados de teste apagados');
        }
        else return;
        Sync.soon(); await render();
      } catch (x) { toast(x.message); }
    });
    tp.addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target, val = String(new FormData(f).get(f.id === 'newTest' ? 'name' : 'body') || '').trim().replace(/\s+/g, ' ');
      try {
        if (f.id === 'newTest') {
          const bad = validName(val); if (bad) return toast(bad);
          const u = await SimServer.test.create(val); toast(`${u.name} #${u.number} criado`);
        } else if (f.dataset.reply) {
          if (!val) return;
          await SimServer.sendMessage({ id: uid(), from: f.dataset.reply, to: me.userId, body: val, createdAt: now() });
          toast('Mensagem enviada ao servidor de teste');
        }
        Sync.soon(); await render();
      } catch (x) { toast(x.message); }
    });
    await render();
  }
});

/* =========================================================
   8. MÓDULO NOTAS
   ========================================================= */
Platform.register({
  id: 'notes', name: 'Notas', icon: '📝', colorVar: '--c-notes',
  state: { q: '', filter: 'all' }, flush: null, cleanup: null,
  async mount(view, params) { return params[0] ? this.editor(view, params[0]) : this.list(view); },

  async list(view) {
    view.innerHTML = `<div class="pad">
      <input class="search" type="search" id="nq" placeholder="Pesquisar notas" aria-label="Pesquisar notas" value="${esc(this.state.q)}">
      <div class="chips" id="chips" role="toolbar" aria-label="Filtrar notas"></div>
      <div id="nlist"></div></div>
      <div class="fab-wrap"><a class="fab" href="#/notes/nova" style="--fab:var(--c-notes)">+ Nova nota</a></div>`;
    const notes = (await Notes.list()).sort((a, b) => (!!b.favorite - !!a.favorite) || b.updatedAt.localeCompare(a.updatedAt));
    const cats = [...new Set(notes.map(n => n.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    if (this.state.filter.startsWith('cat:') && !cats.includes(this.state.filter.slice(4))) this.state.filter = 'all';
    const renderChips = () => {
      const items = [['all', 'Todas'], ['fav', 'Favoritas'], ...cats.map(c => ['cat:' + c, c])];
      $('#chips').innerHTML = items.map(([k, l]) => `<button class="chip" data-k="${esc(k)}" aria-pressed="${this.state.filter === k}">${esc(l)}</button>`).join('');
    };
    const renderList = () => {
      const q = norm(this.state.q), f = this.state.filter;
      const out = notes.filter(n =>
        (f === 'all' || (f === 'fav' && n.favorite) || (f.startsWith('cat:') && n.category === f.slice(4))) &&
        (!q || norm(`${n.title} ${n.body} ${n.category || ''}`).includes(q)));
      $('#nlist').innerHTML = out.length
        ? out.map(n => `<a class="card" href="#/notes/${encodeURIComponent(n.id)}">
            <h3>${n.favorite ? '<span class="star" aria-label="Favorita">★</span> ' : ''}${esc(n.title || 'Sem título')}</h3>
            ${n.body ? `<p>${esc(n.body.slice(0, 300))}</p>` : ''}
            <div class="meta"><span>${fmtWhen(n.updatedAt)}</span>${n.category ? `<span class="cat">${esc(n.category)}</span>` : ''}</div></a>`).join('')
        : notes.length
          ? '<div class="empty"><p>Nenhuma nota encontrada.</p><p>Tente outra palavra ou volte para “Todas”.</p></div>'
          : '<div class="empty"><p>Nenhuma nota ainda.</p><p>Toque em “Nova nota” para escrever a primeira.</p></div>';
    };
    renderChips(); renderList();
    $('#nq').addEventListener('input', e => { this.state.q = e.target.value; renderList(); });
    $('#chips').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      this.state.filter = b.dataset.k; renderChips(); renderList();
    });
  },

  async editor(view, id) {
    let note = id === 'nova' ? null : await Notes.get(id);
    if (id !== 'nova' && !note) { toast('Esta nota não existe mais.'); location.hash = '#/notes'; return; }
    Topbar.setTitle(note ? 'Editar nota' : 'Nova nota');
    view.innerHTML = `<div class="editor">
      <input class="ed-title" id="et" placeholder="Título" aria-label="Título" maxlength="200" value="${esc(note ? note.title : '')}" ${note ? '' : 'autofocus'}>
      <div class="ed-bar">
        <input class="ed-cat" id="ec" list="catlist" placeholder="Categoria" aria-label="Categoria" maxlength="40" value="${esc(note ? note.category || '' : '')}">
        <datalist id="catlist"></datalist>
        <span id="es" class="muted" aria-live="polite">${note ? 'Salvo · ' + fmtWhen(note.updatedAt).toLowerCase() : 'Salva sozinha enquanto você escreve'}</span>
      </div>
      <textarea id="eb" placeholder="Escreva aqui…" aria-label="Conteúdo da nota">${esc(note ? note.body : '')}</textarea>
    </div>`;
    if (!note) setTimeout(() => $('#et') && $('#et').focus(), 50);
    const cats = [...new Set((await Notes.list()).map(n => n.category).filter(Boolean))];
    $('#catlist').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');

    let fav = !!(note && note.favorite), dirty = false, saving = Promise.resolve();
    const status = $('#es');
    const save = async () => {
      if (!dirty) return;
      dirty = false;
      const title = $('#et').value.trim(), body = $('#eb').value, category = $('#ec').value.trim();
      if (!note && !title && !body.trim()) return;           // não cria nota vazia
      try {
        note = await Notes.save({ ...(note || {}), title, body, category, favorite: fav });
        if (id === 'nova') { id = note.id; history.replaceState(null, '', '#/notes/' + encodeURIComponent(id)); Topbar.setTitle('Editar nota'); }
        status.textContent = 'Salvo · ' + fmtWhen(note.updatedAt).toLowerCase();
      } catch (e) {
        console.error(e); dirty = true;
        status.textContent = 'Erro ao salvar. O texto continua aqui; tente de novo.';
      }
    };
    const queueSave = () => (saving = saving.then(save));
    const later = debounce(queueSave, 500);
    const onInput = () => { dirty = true; status.textContent = 'Editando…'; later(); };
    ['#et', '#eb', '#ec'].forEach(s => $(s).addEventListener('input', onInput));

    const renderActions = () => {
      const a = Topbar.actions(`
        <button class="icon-btn" id="favBtn" aria-pressed="${fav}" aria-label="${fav ? 'Remover dos favoritos' : 'Favoritar'}">${fav ? '★' : '☆'}</button>
        <button class="icon-btn" id="delBtn" aria-label="Excluir nota">${ICON.trash}</button>`);
      a.querySelector('#favBtn').onclick = () => { fav = !fav; dirty = true; queueSave(); renderActions(); };
      a.querySelector('#delBtn').onclick = async () => {
        await saving;
        if (!note) { dirty = false; location.hash = '#/notes'; return; }
        if (!(await confirmSheet('Excluir esta nota?', 'Ela será removida deste aparelho.'))) return;
        dirty = false;
        await Notes.remove(note.id);
        this.flush = null;
        toast('Nota excluída');
        location.hash = '#/notes';
      };
    };
    renderActions();

    const onHide = () => { if (document.visibilityState === 'hidden') queueSave(); };
    document.addEventListener('visibilitychange', onHide);
    this.flush = () => queueSave();
    this.cleanup = () => document.removeEventListener('visibilitychange', onHide);
  },

  async unmount() {
    if (this.flush) { await this.flush(); this.flush = null; }
    if (this.cleanup) { this.cleanup(); this.cleanup = null; }
  }
});

/* =========================================================
   9. MÓDULO CALCULADORA (sem eval, com precedência)
   ========================================================= */
Platform.register({
  id: 'calc', name: 'Calculadora', icon: '🧮', colorVar: '--c-calc', cleanup: null,
  mount(view) {
    const OPS = ['+', '−', '×', '÷'];
    const isOp = t => OPS.includes(t);
    let expr = [], done = false, lastExprText = '';
    const KEYS = [
      ['C', 'fn', 'clear', 'Limpar'], ['⌫', 'fn', 'back', 'Apagar'], ['%', 'fn', 'pct', 'Porcentagem'], ['÷', 'op', 'op:÷', 'Dividir'],
      ['7', '', 'd:7'], ['8', '', 'd:8'], ['9', '', 'd:9'], ['×', 'op', 'op:×', 'Multiplicar'],
      ['4', '', 'd:4'], ['5', '', 'd:5'], ['6', '', 'd:6'], ['−', 'op', 'op:−', 'Subtrair'],
      ['1', '', 'd:1'], ['2', '', 'd:2'], ['3', '', 'd:3'], ['+', 'op', 'op:+', 'Somar'],
      ['±', 'fn', 'neg', 'Inverter sinal'], ['0', '', 'd:0'], [',', '', 'dot', 'Vírgula'], ['=', 'eq', 'eq', 'Resultado']
    ];
    view.innerHTML = `<div class="calc">
      <div class="display">
        <div class="prev-expr muted" id="cpe"></div>
        <output class="expr" id="cx" aria-live="polite">0</output>
        <div class="preview" id="cp"></div>
      </div>
      <div class="keys" id="keys">${KEYS.map(([l, c, a, aria]) =>
        `<button class="key ${c}" data-a="${a}" ${aria ? `aria-label="${aria}"` : ''}>${l}</button>`).join('')}</div>
    </div>`;

    const lastTok = () => expr[expr.length - 1];
    const toStr = v => String(Object.is(v, -0) ? 0 : v);
    const fmtNum = s => {
      if (s === undefined) return '';
      if (/e/i.test(s)) return s.replace('.', ',');
      const neg = s.startsWith('-'); if (neg) s = s.slice(1);
      let [i, d] = s.split('.');
      i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return (neg ? '−' : '') + i + (d !== undefined ? ',' + d : '');
    };
    const exprText = toks => toks.map(t => isOp(t) ? ` ${t} ` : fmtNum(t)).join('');
    function evaluate(toks) {
      const t = [...toks]; while (t.length && isOp(t[t.length - 1])) t.pop();
      if (!t.length) return 0;
      const s = [parseFloat(t[0])];
      for (let i = 1; i < t.length; i += 2) {            // 1º: × e ÷
        const op = t[i], n = parseFloat(t[i + 1]);
        if (op === '×') s[s.length - 1] *= n;
        else if (op === '÷') { if (n === 0) throw new Error('Não é possível dividir por zero'); s[s.length - 1] /= n; }
        else s.push(op, n);
      }
      let r = s[0];                                      // 2º: + e −
      for (let i = 1; i < s.length; i += 2) r = s[i] === '+' ? r + s[i + 1] : r - s[i + 1];
      if (!isFinite(r)) throw new Error('Resultado fora do limite');
      return parseFloat(r.toPrecision(12));              // corrige 0,1 + 0,2
    }
    const render = err => {
      const x = $('#cx'), p = $('#cp');
      if (err) { x.textContent = 'Erro'; p.textContent = err; $('#cpe').textContent = ''; return; }
      x.textContent = expr.length ? exprText(expr) : '0';
      let prev = '';
      if (!done && expr.some(isOp)) { try { prev = '= ' + fmtNum(toStr(evaluate(expr))); } catch (e) { prev = ''; } }
      p.textContent = prev;
      $('#cpe').textContent = done && lastExprText ? lastExprText + ' =' : '';
      x.style.fontSize = x.textContent.length > 16 ? 'clamp(1.4rem,7vw,2rem)' : '';
    };
    const act = a => {
      if (a.startsWith('d:')) {
        const d = a.slice(2);
        if (done) { expr = []; done = false; }
        const l = lastTok();
        if (l !== undefined && !isOp(l)) {
          if (l.replace(/[-.]/g, '').length >= 15) return;
          expr[expr.length - 1] = l === '0' ? d : l === '-0' ? '-' + d : l + d;
        } else expr.push(d);
      } else if (a === 'dot') {
        if (done) { expr = []; done = false; }
        const l = lastTok();
        if (l !== undefined && !isOp(l)) { if (!l.includes('.')) expr[expr.length - 1] = l + '.'; }
        else expr.push('0.');
      } else if (a.startsWith('op:')) {
        const op = a.slice(3);
        done = false;                                    // continua a partir do resultado
        if (!expr.length) expr.push('0');
        const l = lastTok();
        if (isOp(l)) expr[expr.length - 1] = op;
        else { if (l.endsWith('.')) expr[expr.length - 1] = l.slice(0, -1); expr.push(op); }
      } else if (a === 'pct') {
        const l = lastTok(); if (l === undefined || isOp(l)) return;
        done = false;
        const n = parseFloat(l), op = expr[expr.length - 2];
        // 200 + 10% = 220  |  200 × 10% = 20
        const v = (op === '+' || op === '−') ? evaluate(expr.slice(0, -2)) * n / 100 : n / 100;
        expr[expr.length - 1] = toStr(parseFloat(v.toPrecision(12)));
      } else if (a === 'neg') {
        const l = lastTok(); if (l === undefined || isOp(l)) return;
        done = false;
        expr[expr.length - 1] = l.startsWith('-') ? l.slice(1) : '-' + l;
      } else if (a === 'back') {
        if (done) { expr = []; done = false; }
        else {
          const l = lastTok();
          if (l === undefined) return;
          if (isOp(l) || l.length <= 1 || (l.length === 2 && l.startsWith('-'))) expr.pop();
          else expr[expr.length - 1] = l.slice(0, -1);
        }
      } else if (a === 'clear') { expr = []; done = false; lastExprText = ''; }
      else if (a === 'eq') {
        while (expr.length && isOp(lastTok())) expr.pop();
        if (!expr.some(isOp)) { render(); return; }
        const v = evaluate(expr), text = exprText(expr), res = toStr(v);
        lastExprText = text; expr = [res]; done = true;
        DB.put('calcHistory', { id: uid(), expr: text, result: res, createdAt: now() }).catch(console.error);
      }
      render();
    };
    const run = a => { try { act(a); } catch (e) { expr = []; done = false; render(e.message); } };
    $('#keys').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) run(b.dataset.a); });

    const keymap = { '+': 'op:+', '-': 'op:−', '*': 'op:×', 'x': 'op:×', '/': 'op:÷', 'Enter': 'eq', '=': 'eq',
                     'Backspace': 'back', 'Delete': 'clear', '%': 'pct', ',': 'dot', '.': 'dot' };
    const onKey = e => {
      if (!$('#sheet').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
      const a = /^\d$/.test(e.key) ? 'd:' + e.key : keymap[e.key];
      if (!a) return; e.preventDefault(); run(a);
    };
    document.addEventListener('keydown', onKey);
    this.cleanup = () => document.removeEventListener('keydown', onKey);

    const showHistory = async () => {
      const items = (await DB.all('calcHistory')).sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 50);
      const el = Sheet.open(`<h2>Histórico</h2>${items.length
        ? `<ul class="hist">${items.map(h => `<li><button data-r="${esc(h.result)}"><span class="muted">${esc(h.expr)} =</span><b>${esc(fmtNum(h.result))}</b></button></li>`).join('')}</ul>
           <div class="actions"><button class="btn danger grow" id="hclear">Limpar histórico</button></div>`
        : '<p class="muted">Os cálculos que você fizer aparecem aqui. Toque em um para reutilizar o resultado.</p>'}`);
      const list = el.querySelector('.hist');
      if (list) list.addEventListener('click', e => {
        const b = e.target.closest('[data-r]'); if (!b) return;
        expr = [b.dataset.r]; done = true; lastExprText = ''; render(); Sheet.close();
      });
      const clr = el.querySelector('#hclear');
      if (clr) clr.onclick = async () => { await DB.clear('calcHistory'); Sheet.close(); toast('Histórico limpo'); };
    };
    Topbar.actions(`<button class="icon-btn" id="histBtn" aria-label="Histórico">${ICON.history}</button>`)
      .querySelector('#histBtn').onclick = showHistory;
    render();
  },
  unmount() { if (this.cleanup) { this.cleanup(); this.cleanup = null; } }
});

/* =========================================================
   10. MÓDULO CALENDÁRIO
   ========================================================= */
const REMINDERS = [['', 'Sem lembrete'], ['0', 'Na hora'], ['10', '10 min antes'], ['30', '30 min antes'], ['60', '1 hora antes'], ['1440', '1 dia antes']];
const reminderLabel = v => (REMINDERS.find(r => r[0] === String(v)) || ['', ''])[1];
Platform.register({
  id: 'calendar', name: 'Calendário', icon: '📅', colorVar: '--c-cal',
  async mount(view, params) {
    const today = ymd(new Date());
    let sel = /^\d{4}-\d{2}-\d{2}$/.test(params[0] || '') ? params[0] : today;
    let vy, vm;
    const syncView = () => { const [y, m] = sel.split('-').map(Number); vy = y; vm = m - 1; };
    syncView();
    let events = await Events.list();

    view.innerHTML = `<div class="cal">
      <div class="cal-head">
        <button class="icon-btn" id="prev" aria-label="Mês anterior">‹</button>
        <h2 id="mtitle" aria-live="polite"></h2>
        <button class="icon-btn" id="next" aria-label="Próximo mês">›</button>
      </div>
      <div class="weekdays" aria-hidden="true">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="days" id="days"></div>
      <section class="day-panel"><h3 id="dtitle"></h3><div id="dlist"></div></section>
    </div>
    <div class="fab-wrap"><button class="fab" id="newEv" style="--fab:var(--c-cal)">+ Novo evento</button></div>`;
    Topbar.actions('<button class="text-btn" id="goToday">Hoje</button>').querySelector('#goToday').onclick = () => select(today);

    const renderMonth = () => {
      const first = new Date(vy, vm, 1);
      $('#mtitle').textContent = cap(first.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
      const daysIn = new Date(vy, vm + 1, 0).getDate();
      const cells = Math.ceil((first.getDay() + daysIn) / 7) * 7;
      const withEv = new Set(events.map(e => e.date));
      let html = '';
      for (let i = 0; i < cells; i++) {
        const d = new Date(vy, vm, 1 - first.getDay() + i), k = ymd(d), has = withEv.has(k);
        html += `<button class="day${d.getMonth() !== vm ? ' out' : ''}${k === today ? ' today' : ''}" data-d="${k}" aria-pressed="${k === sel}"
          aria-label="${d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' })}${has ? ', tem eventos' : ''}">
          <span>${d.getDate()}</span><i class="dot" style="visibility:${has ? 'visible' : 'hidden'}"></i></button>`;
      }
      $('#days').innerHTML = html;
    };
    const renderDay = () => {
      const [y, m, d] = sel.split('-').map(Number);
      $('#dtitle').textContent = sel === today ? 'Hoje' : cap(new Date(y, m - 1, d).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }));
      const list = events.filter(e => e.date === sel).sort(byTime);
      $('#dlist').innerHTML = list.length
        ? list.map(e => `<button class="ev" data-id="${esc(e.id)}"><time>${e.time || 'Dia todo'}</time>
            <span class="grow"><b>${esc(e.title)}</b>${e.description ? `<small>${esc(e.description)}</small>` : ''}
            ${e.reminder ? `<small>🔔 ${reminderLabel(e.reminder)}</small>` : (e.reminder === '0' ? '' : '')}</span></button>`).join('')
        : '<p class="muted">Nenhum evento neste dia.</p>';
    };
    const select = k => {
      sel = k; syncView(); renderMonth(); renderDay();
      history.replaceState(null, '', '#/calendar/' + sel);
    };
    const reload = async () => { events = await Events.list(); renderMonth(); renderDay(); };

    const openForm = ev => {
      const el = Sheet.open(`<form id="evf" novalidate>
        <h2>${ev ? 'Editar evento' : 'Novo evento'}</h2>
        <label class="field"><span>Título</span><input name="title" maxlength="120" value="${esc(ev ? ev.title : '')}" autofocus></label>
        <label class="field"><span>Descrição</span><textarea name="description" rows="3" maxlength="1000">${esc(ev ? ev.description || '' : '')}</textarea></label>
        <div class="row">
          <label class="field"><span>Data</span><input type="date" name="date" value="${esc(ev ? ev.date : sel)}"></label>
          <label class="field"><span>Horário</span><input type="time" name="time" value="${esc(ev ? ev.time || '' : '')}"></label>
        </div>
        <label class="field"><span>Lembrete</span><select name="reminder">${REMINDERS.map(([v, l]) =>
          `<option value="${v}" ${String(ev ? ev.reminder ?? '' : '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <p class="hint">Sem horário, o evento vale o dia inteiro. O lembrete fica salvo, mas o aviso no celular depende das notificações nativas do Android. ${tag('android')}</p>
        <p class="err" id="everr" role="alert"></p>
        <div class="actions">
          ${ev ? '<button type="button" class="btn danger" id="evdel">Excluir</button>' : ''}
          <button type="button" class="btn grow" id="evcancel">Cancelar</button>
          <button type="submit" class="btn primary grow">Salvar</button>
        </div></form>`);
      const err = m => { el.querySelector('#everr').textContent = m; };
      el.querySelector('#evcancel').onclick = () => Sheet.close();
      el.querySelector('#evf').addEventListener('submit', async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const title = String(f.get('title') || '').trim(), date = String(f.get('date') || '');
        if (!title) return err('Dê um título ao evento.');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err('Escolha uma data válida.');
        try {
          await Events.save({ ...(ev || {}), title, date,
            description: String(f.get('description') || '').trim(),
            time: String(f.get('time') || ''),
            reminder: String(f.get('reminder') || '') });
        } catch (x) { return err('Não foi possível salvar: ' + x.message); }
        Sheet.close(); sel = date; syncView(); await reload();
        history.replaceState(null, '', '#/calendar/' + sel);
        toast(ev ? 'Evento atualizado' : 'Evento criado');
      });
      const del = el.querySelector('#evdel');
      if (del) del.onclick = async () => {
        if (!(await confirmSheet('Excluir este evento?', `“${ev.title}” será removido deste aparelho.`))) return;
        await Events.remove(ev.id); await reload(); toast('Evento excluído');
      };
    };

    $('#prev').onclick = () => { vm--; if (vm < 0) { vm = 11; vy--; } renderMonth(); };
    $('#next').onclick = () => { vm++; if (vm > 11) { vm = 0; vy++; } renderMonth(); };
    $('#days').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) select(b.dataset.d); });
    $('#dlist').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openForm(events.find(x => x.id === b.dataset.id)); });
    $('#newEv').onclick = () => openForm(null);
    renderMonth(); renderDay();
  }
});

/* =========================================================
   11. STATUS DO SISTEMA — o que é real e o que falta
   ========================================================= */
const FEATURES = [
  ['Tela inicial e central de módulos', 'ok'],
  ['Notas: criar, editar, excluir, pesquisar, favoritar, categorizar, salvar sozinha', 'ok'],
  ['Calculadora com histórico', 'ok'],
  ['Calendário: mês, dias, criar, editar e excluir eventos', 'ok'],
  ['Banco local no aparelho (IndexedDB)', 'ok'],
  ['Fila local de alterações para sincronizar', 'ok'],
  ['Perfil com nome, foto e identificador (neste aparelho)', 'ok'],
  ['Telas e regras de contatos, solicitações e conversas', 'ok'],
  ['Estados da mensagem, fila de pendentes e reenvio sem duplicar', 'ok'],
  ['Gerenciador de conexão (escolhe o canal ou deixa pendente)', 'ok'],
  ['Servidor de teste local para simular outras pessoas', 'proto'],
  ['Identificador garantido como único entre todos os usuários', 'backend'],
  ['Encontrar pessoas reais e conversar pela internet', 'backend'],
  ['Sincronização com banco central', 'backend'],
  ['Acesso pelo computador com código temporário', 'backend'],
  ['Notificação de nova mensagem e aviso de lembrete', 'android'],
  ['Comunicação por Bluetooth', 'android'],
  ['Bloquear usuário', 'future'],
  ['Instalar novos módulos pelo botão +', 'future'],
  ['Imagens, áudios, grupos e chamadas', 'future']
];
const Status = {
  id: 'status', name: 'Status do sistema',
  async mount(view) {
    const pending = await Outbox.count();
    const pendingMsgs = (await DB.all('messages')).filter(m => m.status === 'pending' || m.status === 'sending').length;
    const theme = await Settings.get('theme', 'system');
    let usage = null, persisted = false;
    try { if (navigator.storage && navigator.storage.estimate) usage = (await navigator.storage.estimate()).usage; } catch (e) {}
    try { if (navigator.storage && navigator.storage.persisted) persisted = await navigator.storage.persisted(); } catch (e) {}
    view.innerHTML = `<div class="pad">
      <section class="panel"><h2>Este aparelho</h2>
        <dl class="kv">
          <dt>Banco local</dt><dd>${DB.engine === 'indexeddb' ? 'IndexedDB' : 'Memória (temporário)'}</dd>
          <dt>ID do aparelho</dt><dd>${esc(String(App.deviceId).slice(0, 8))}</dd>
          <dt>Alterações aguardando envio</dt><dd>${pending}</dd>
          <dt>Mensagens pendentes</dt><dd>${pendingMsgs}</dd>
          <dt>Espaço usado</dt><dd>${fmtBytes(usage)}</dd>
          <dt>Protegido contra limpeza</dt><dd>${persisted ? 'Sim' : 'Não'}</dd>
        </dl>
        ${persisted || !(navigator.storage && navigator.storage.persist) ? '' : '<button class="btn" id="persist" style="width:100%;margin-top:8px">Proteger dados contra limpeza automática</button>'}
      </section>
      <section class="panel"><h2>Servidor</h2>
        <div class="switch-row"><span>Modo de teste local ${tag('proto')}</span>
          <button class="switch" role="switch" id="simMode" aria-checked="${Backend.mode === 'sim'}" aria-label="Modo de teste local"></button></div>
        <p class="muted small" style="margin:0">Simula o servidor central dentro deste aparelho para testar perfil, contatos, solicitações e mensagens. Não conecta com outras pessoas de verdade.</p>
        ${Sync.lastError ? `<p class="err" style="margin-top:10px">Última sincronização falhou: ${esc(Sync.lastError)}</p>` : ''}
      </section>
      <section class="panel"><h2>Aparência</h2>
        <div class="seg" role="radiogroup" aria-label="Tema">
          ${[['system', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([v, l]) =>
            `<button role="radio" data-t="${v}" aria-checked="${theme === v}">${l}</button>`).join('')}
        </div>
      </section>
      <section class="panel"><h2>Funcionalidades</h2>
        <ul class="status-list">${FEATURES.map(([n, k]) => `<li><span>${n}</span>${tag(k)}</li>`).join('')}</ul>
      </section>
      <p class="muted small" style="margin-top:16px">Cada alteração entra numa fila deste aparelho. Quando o banco central existir (Fase 3), a fila será enviada e o contador voltará a zero.</p>
    </div>`;
    $('#simMode').onclick = async () => {
      Backend.mode = Backend.mode === 'sim' ? 'none' : 'sim';
      await Settings.set('backendMode', Backend.mode);
      toast(Backend.mode === 'sim' ? 'Modo de teste ligado' : 'Modo de teste desligado');
      Bus.emit('conn'); Sync.soon(); this.mount(view);
    };
    const p = $('#persist');
    if (p) p.onclick = async () => {
      let ok = false; try { ok = await navigator.storage.persist(); } catch (e) {}
      toast(ok ? 'Dados protegidos' : 'O navegador não liberou a proteção agora');
      this.mount(view);
    };
    view.querySelector('.seg').addEventListener('click', async e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      await Settings.set('theme', b.dataset.t); applyTheme(b.dataset.t);
      view.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-checked', x === b));
    });
  }
};

/* =========================================================
   12. INICIALIZAÇÃO
   ========================================================= */
(async function init() {
  await DB.open();
  try {
    let dev = await Settings.get('deviceId');
    if (!dev) { dev = uid(); await Settings.set('deviceId', dev); }
    App.deviceId = dev;
    applyTheme(await Settings.get('theme', 'system'));
    Backend.mode = await Settings.get('backendMode', 'none');
    await Identity.load();
  } catch (e) { console.error(e); App.deviceId = App.deviceId || uid(); }
  if (DB.engine !== 'indexeddb') toast('Banco local indisponível: os dados desta sessão não serão salvos.');
  window.addEventListener('hashchange', route);
  route();
  Sync.start();
})();
</script>
