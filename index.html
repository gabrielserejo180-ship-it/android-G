<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Núcleo</title>
<meta name="theme-color" content="#E8EDF1">
<!-- Supabase (servidor central). Fica guardado pelo sw.js para abrir sem internet. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DESIGN
   ========================================================= */
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --surface-2:#F1F4F7; --ink:#17222E; --ink-2:#5A6878; --line:#D3DCE4;
  --primary:#2F5BD3; --on-primary:#FFFFFF; --danger:#C2334D;
  --c-msg:#13897D; --c-notes:#C98A12; --c-calc:#3E4A5A; --c-cal:#C4385E;
  --shadow:0 1px 2px rgba(23,34,46,.06), 0 6px 18px rgba(23,34,46,.07);
  --font:"Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D; --surface:#17212C; --surface-2:#1F2B38; --ink:#E6ECF2; --ink-2:#93A1B0; --line:#2A3847;
    --primary:#7397FF; --on-primary:#0E151D; --danger:#FF6F86;
    --c-msg:#2BB3A4; --c-notes:#E5AA3A; --c-calc:#62708A; --c-cal:#E8607F;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D; --surface:#17212C; --surface-2:#1F2B38; --ink:#E6ECF2; --ink-2:#93A1B0; --line:#2A3847;
  --primary:#7397FF; --on-primary:#0E151D; --danger:#FF6F86;
  --c-msg:#2BB3A4; --c-notes:#E5AA3A; --c-calc:#62708A; --c-cal:#E8607F;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--primary)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.muted{color:var(--ink-2)}
.small{font-size:.8rem}
.grow{flex:1}
[hidden]{display:none!important}

#app{flex:1;display:flex;flex-direction:column;width:100%;max-width:480px;margin:0 auto}
#view{flex:1;display:flex;flex-direction:column}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:4px;padding:8px 8px;background:var(--bg)}
.topbar h1{flex:1;margin:0;font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:2px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;font-size:1.3rem}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed="true"]{color:var(--c-notes)}
.text-btn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.88rem;font-weight:500}

/* Início */
.home{padding:36px 22px 40px}
.clock{font-size:clamp(4.2rem,24vw,6.5rem);font-weight:300;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.date{color:var(--ink-2);margin-top:10px;font-size:1.02rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;margin-top:44px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:.76rem;background:none;border:0;padding:0;cursor:pointer;text-align:center}
.tile .ic{position:relative;width:64px;height:64px;border-radius:21px;display:grid;place-items:center;font-size:1.85rem;background:var(--tile);box-shadow:var(--shadow);transition:transform .15s}
.tile:active .ic{transform:scale(.93)}
.tile.add .ic{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--ink-2);font-size:1.8rem;font-weight:300}
.badge{position:absolute;top:-7px;right:-12px;font-style:normal;font-size:.58rem;font-weight:600;line-height:1;padding:4px 6px;border-radius:8px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

.panel{background:var(--surface);border-radius:20px;padding:16px 18px;margin-top:16px}
.home .panel{margin-top:40px}
.panel h2{margin:0;font-size:.95rem;font-weight:600}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.panel-head a{font-size:.85rem;text-decoration:none}
.today-ev{display:flex;gap:14px;padding:8px 0;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.today-ev:first-child{border-top:0}
.today-ev time{min-width:62px;color:var(--c-cal);font-weight:600;font-variant-numeric:tabular-nums}
.home-foot{margin-top:22px;display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--ink-2)}
.home-foot a{color:var(--ink-2)}

/* Listas e cartões */
.pad{padding:4px 16px 120px}
.search{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font:inherit;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{display:block;background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.card h3{margin:0 0 4px;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.card p{margin:0;color:var(--ink-2);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.star{color:var(--c-notes)}
.meta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:.75rem;color:var(--ink-2)}
.cat{padding:2px 8px;border-radius:6px;background:var(--surface-2)}
.empty{text-align:center;padding:56px 24px;color:var(--ink-2)}
.empty p{margin:4px 0}
.empty p:first-child{color:var(--ink);font-weight:500}

.fab-wrap{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;justify-content:flex-end;pointer-events:none;
  padding:0 18px calc(20px + env(safe-area-inset-bottom,0px))}
.fab{pointer-events:auto;height:54px;padding:0 22px;border-radius:18px;border:0;display:inline-flex;align-items:center;gap:6px;
  background:var(--fab,var(--primary));color:#fff;font-weight:600;font-size:.95rem;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.18);cursor:pointer}

/* Editor de nota */
.editor{flex:1;display:flex;flex-direction:column;padding:0 18px 24px}
.ed-title{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.55rem;font-weight:600;padding:6px 0}
.ed-title::placeholder,.editor textarea::placeholder{color:var(--ink-2);opacity:.7}
.ed-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line);font-size:.8rem}
.ed-cat{height:32px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;font-size:.82rem;width:150px}
.editor textarea{flex:1;min-height:55vh;border:0;background:transparent;resize:none;font:inherit;font-size:1rem;line-height:1.65;color:var(--ink);padding:14px 0}
.editor textarea:focus,.ed-title:focus{outline:none}

/* Calculadora */
.calc{flex:1;display:flex;flex-direction:column;padding:0 14px 16px}
.display{flex:1;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:4px;padding:12px 6px 18px;text-align:right}
.prev-expr{font-size:.95rem;min-height:1.4em;overflow-wrap:anywhere}
.expr{font-size:clamp(2.2rem,11vw,3.2rem);font-weight:400;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.preview{color:var(--ink-2);font-size:1.25rem;min-height:1.5em;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{height:clamp(58px,9.5vh,74px);border:0;border-radius:22px;background:var(--surface);font-size:1.55rem;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .08s}
.key:active{transform:scale(.95)}
.key.fn{background:var(--surface-2);color:var(--ink-2);font-size:1.15rem;font-weight:500}
.key.op{background:var(--surface-2);color:var(--primary);font-size:1.7rem}
.key.eq{background:var(--primary);color:var(--on-primary);font-size:1.7rem}
.hist{list-style:none;margin:0 0 12px;padding:0}
.hist button{width:100%;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:right}
.hist b{font-size:1.2rem;font-weight:600}

/* Calendário */
.cal{padding-bottom:120px}
.cal-head{display:flex;align-items:center;gap:4px;padding:0 10px}
.cal-head h2{flex:1;margin:0;text-align:center;font-size:1.2rem;font-weight:600}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px}
.weekdays span{text-align:center;font-size:.75rem;color:var(--ink-2);padding:10px 0 4px}
.day{aspect-ratio:1/1;border:0;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:.95rem;font-variant-numeric:tabular-nums}
.day.out{opacity:.38}
.day.today{color:var(--c-cal);font-weight:700}
.day[aria-pressed="true"]{background:var(--c-cal);color:#fff;font-weight:600}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.day-panel{margin:14px 16px 0}
.day-panel h3{margin:0 0 10px;font-size:1rem;font-weight:600}
.ev{width:100%;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:0;border-radius:16px;padding:14px 16px;margin-bottom:10px;text-align:left;cursor:pointer}
.ev time{min-width:58px;font-weight:600;color:var(--c-cal);font-variant-numeric:tabular-nums}
.ev b{display:block;font-weight:600;overflow-wrap:anywhere}
.ev small{display:block;color:var(--ink-2);font-size:.82rem;margin-top:2px;overflow-wrap:anywhere}

/* Mensagens / status */
.notice{background:var(--surface);border-radius:20px;padding:20px}
.notice h2{margin:0 0 8px;font-size:1.1rem}
.notice p{margin:0;color:var(--ink-2);font-size:.92rem}
.sec{font-size:.95rem;margin:26px 0 10px}
.phases{margin:0;padding:0;list-style:none}
.phases li{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:.9rem}
.phases b{display:block;margin-bottom:4px}
.phases .tag{margin-top:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;margin:12px 0 4px;font-size:.88rem}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-weight:500}
.status-list{list-style:none;margin:8px 0 0;padding:0}
.status-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:.88rem}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.85rem}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mod-list{list-style:none;margin:14px 0;padding:0}
.mod-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mini-ic{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:1.2rem}

.tag{display:inline-block;font-size:.68rem;font-weight:600;padding:4px 8px;border-radius:7px;white-space:nowrap;line-height:1.1}
.tag.ok{background:color-mix(in srgb,var(--c-msg) 16%,transparent);color:var(--c-msg)}
.tag.proto{background:color-mix(in srgb,var(--c-notes) 18%,transparent);color:var(--c-notes)}
.tag.backend{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.tag.android{background:color-mix(in srgb,var(--c-cal) 15%,transparent);color:var(--c-cal)}
.tag.future{background:var(--surface-2);color:var(--ink-2)}

/* Folha inferior (formulários e confirmações) */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(8,14,22,.45);opacity:0;transition:opacity .2s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;max-height:90%;overflow:auto;background:var(--surface);
  border-radius:26px 26px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 16px}
.sheet h2{margin:0 0 14px;font-size:1.15rem;font-weight:600}
.sheet p{margin:0 0 12px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.8rem;color:var(--ink-2);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:11px 12px;font:inherit}
.field textarea{resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.hint{font-size:.78rem;color:var(--ink-2)}
.err{color:var(--danger);font-size:.85rem;min-height:1em}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{height:50px;padding:0 18px;border-radius:15px;border:0;background:var(--surface-2);font-weight:600;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.danger-fill{background:var(--danger);color:#fff}

.toast-wrap{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;padding:0 16px calc(92px + env(safe-area-inset-bottom,0px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:.88rem;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:420px}
.toast.show{opacity:1;transform:none}

/* Fase 2 — perfil, contatos, conversas */
.home{position:relative}
.home-top{position:absolute;top:24px;right:20px}
.home-top a{display:block;border-radius:50%;text-decoration:none}
.badge.n{background:var(--c-msg);color:#fff;border-color:transparent;font-size:.68rem;padding:4px 7px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.95rem;color:#fff;background:var(--av,var(--c-msg));overflow:hidden;object-fit:cover}
.avatar.sm{width:38px;height:38px;font-size:.82rem}
.avatar.lg{width:104px;height:104px;font-size:2.2rem}
img.avatar{background:var(--surface-2)}
.tabs{display:flex;gap:6px;padding:4px 16px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);background:var(--bg);z-index:4}
.tabs a{flex:1;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink-2);font-size:.86rem;font-weight:500;border:1px solid var(--line)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--c-msg);color:#fff;font-size:.7rem;font-weight:700;display:inline-grid;place-items:center}
.row-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-decoration:none;color:var(--ink);text-align:left}
a.row-item{cursor:pointer}
.row-item .info{flex:1;min-width:0}
.row-item .info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .info small{display:block;color:var(--ink-2);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.72rem;color:var(--ink-2)}
.handle{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:500}
.conn{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-2);padding:9px 12px;border-radius:12px;background:var(--surface);margin-bottom:12px}
.conn i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.conn.on i{background:var(--c-msg)}
.btn.sm{height:38px;padding:0 13px;border-radius:12px;font-size:.84rem}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.chat{flex:1;display:flex;flex-direction:column}
.chat-log{flex:1;padding:4px 14px 12px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:82%;padding:9px 12px 5px;border-radius:18px 18px 18px 6px;background:var(--surface);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;font-size:.95rem;line-height:1.4}
.bubble.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:color-mix(in srgb,var(--c-msg) 22%,var(--surface))}
.bubble[data-retry]{cursor:pointer;outline:1px solid var(--danger)}
.st{display:flex;justify-content:flex-end;gap:5px;font-size:.68rem;color:var(--ink-2);margin-top:2px;white-space:nowrap}
.st.read .tick{color:var(--primary)}
.st.failed .tick{color:var(--danger)}
.fail-note{align-self:flex-end;color:var(--danger);font-size:.72rem;margin-top:-2px}
.day-sep{align-self:center;font-size:.72rem;color:var(--ink-2);padding:8px 0 4px}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:8px 12px 12px;background:var(--bg)}
.composer textarea{flex:1;min-height:46px;max-height:140px;border-radius:23px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;font:inherit;resize:none}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--c-msg);color:#fff;font-size:1.15rem;cursor:pointer}
.send:disabled{opacity:.35;cursor:default}
.sim-banner{font-size:.78rem;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c-notes) 16%,transparent);color:var(--ink);margin-bottom:12px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.switch{flex:none;width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--c-msg)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.profile-head{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0 18px}
.profile-head .tagline{font-size:1.35rem;font-weight:600}
.photo-btn{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.photo-btn .cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:.95rem;border:3px solid var(--bg)}
.test-user{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px}
.test-user .btn-row{margin-top:10px}
.inline-form{display:flex;gap:8px;margin-top:10px}
.inline-form input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit}

/* Anexos */
.attach{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.attach svg{width:22px;height:22px}
.attach:disabled{opacity:.35;cursor:default}
.bubble.has-att{padding:4px 4px 5px}
.bubble.has-att .txt{display:block;padding:6px 8px 0}
.bubble.has-att .st{padding:0 8px}

<body>
<div id="app">
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="backBtn" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="topTitle"></h1>
    <div class="top-actions" id="topActions"></div>
  </header>
  <main id="view"></main>
</div>
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast-wrap"><div class="toast" id="toast" role="status"></div></div>

<script>
'use strict';
/* =========================================================
   1. UTILITÁRIOS
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => {                       // UUID v4 (o banco central exige esse formato)
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
};
const now = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const byTime = (a, b) => (a.time || '').localeCompare(b.time || '');
const fmtBytes = n => n == null ? '—' : n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
function fmtWhen(iso) {
  const d = new Date(iso), t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const today = ymd(new Date()), y = new Date(); y.setDate(y.getDate() - 1);
  if (ymd(d) === today) return `Hoje, ${t}`;
  if (ymd(d) === ymd(y)) return `Ontem, ${t}`;
  return `${d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', year: 'numeric' })}, ${t}`;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
const ICON = {
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>'
};
const TAGS = { ok: ['ok', 'Implementado'], proto: ['proto', 'Protótipo'], backend: ['backend', 'Depende de backend'],
               android: ['android', 'Depende do Android'], future: ['future', 'Futuro'] };
const tag = k => `<span class="tag ${TAGS[k][0]}">${TAGS[k][1]}</span>`;

/* =========================================================
   2. BANCO LOCAL — IndexedDB (com reserva em memória)
   Na versão APK, esta camada pode ser trocada por SQLite
   (plugin Capacitor) sem mudar os módulos.
   ========================================================= */
const DB = (() => {
  const NAME = 'nucleo', VERSION = 3;
  const KEYS = { notes: 'id', events: 'id', calcHistory: 'id', settings: 'key', outbox: 'id',
                 contacts: 'id', requests: 'id', messages: 'id', sim_users: 'id', sim_requests: 'id', sim_messages: 'id', files: 'id' };
  let idb = null, mem = null, engine = 'none';
  const p = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const useMemory = () => { mem = {}; for (const k in KEYS) mem[k] = new Map(); engine = 'memory'; };
  function open() {
    return new Promise(res => {
      try {
        const req = indexedDB.open(NAME, VERSION);
        req.onupgradeneeded = ev => {
          const d = req.result, old = ev.oldVersion;
          if (old < 1) {                                   // Fase 1
            d.createObjectStore('notes', { keyPath: 'id' }).createIndex('updatedAt', 'updatedAt');
            d.createObjectStore('events', { keyPath: 'id' }).createIndex('date', 'date');
            d.createObjectStore('calcHistory', { keyPath: 'id' }).createIndex('createdAt', 'createdAt');
            d.createObjectStore('settings', { keyPath: 'key' });
            d.createObjectStore('outbox', { keyPath: 'id' });
          }
          if (old < 2) {                                   // Fase 2 (migração sem perder dados)
            d.createObjectStore('contacts', { keyPath: 'id' });
            d.createObjectStore('requests', { keyPath: 'id' });
            d.createObjectStore('messages', { keyPath: 'id' }).createIndex('peer', 'peer');
            d.createObjectStore('sim_users', { keyPath: 'id' });
            d.createObjectStore('sim_requests', { keyPath: 'id' });
            d.createObjectStore('sim_messages', { keyPath: 'id' });
          }
          if (old < 3) d.createObjectStore('files', { keyPath: 'id' });   // anexos guardados no aparelho
        };
        req.onsuccess = () => { idb = req.result; idb.onversionchange = () => idb.close(); engine = 'indexeddb'; res(engine); };
        req.onerror = () => { useMemory(); res(engine); };
        req.onblocked = () => { useMemory(); res(engine); };
      } catch (e) { useMemory(); res(engine); }
    });
  }
  const st = (name, mode = 'readonly') => idb.transaction(name, mode).objectStore(name);
  return {
    open, get engine() { return engine; },
    async all(n) { return mem ? [...mem[n].values()].map(v => structuredClone(v)) : p(st(n).getAll()); },
    async get(n, k) { return mem ? structuredClone(mem[n].get(k)) : p(st(n).get(k)); },
    async put(n, v) { if (mem) { mem[n].set(v[KEYS[n]], structuredClone(v)); return; } return p(st(n, 'readwrite').put(v)); },
    async del(n, k) { if (mem) { mem[n].delete(k); return; } return p(st(n, 'readwrite').delete(k)); },
    async clear(n) { if (mem) { mem[n].clear(); return; } return p(st(n, 'readwrite').clear()); },
    async count(n) { return mem ? mem[n].size : p(st(n).count()); },
    async byIndex(n, idx, val) { return mem ? [...mem[n].values()].filter(v => v[idx] === val).map(v => structuredClone(v)) : p(st(n).index(idx).getAll(val)); }
  };
})();

/* =========================================================
   3. REPOSITÓRIOS + FILA DE SINCRONIZAÇÃO (outbox)
   Cada registro já nasce pronto para sincronizar:
   id único, versão, data de alteração, aparelho de origem,
   exclusão lógica (para propagar exclusões) e status.
   ========================================================= */
const App = { deviceId: null };
const Outbox = {
  // Uma entrada por registro: várias edições seguidas não geram duplicatas
  enqueue(entity, entityId, op) { return DB.put('outbox', { id: `${entity}:${entityId}`, entity, entityId, op, queuedAt: now() }); },
  count() { return DB.count('outbox'); }
};
function Repository(name) {
  return {
    async list() { return (await DB.all(name)).filter(r => !r.deleted); },
    async get(id) { const r = await DB.get(name, id); return r && !r.deleted ? r : null; },
    async save(data) {
      const prev = data.id ? await DB.get(name, data.id) : null;
      const rec = { ...(prev || {}), ...data,
        id: data.id || uid(),
        createdAt: (prev && prev.createdAt) || now(),
        updatedAt: now(),
        version: ((prev && prev.version) || 0) + 1,
        deviceId: App.deviceId,
        deleted: false,
        syncStatus: 'pending' };
      await DB.put(name, rec);
      await Outbox.enqueue(name, rec.id, 'upsert');
      return rec;
    },
    async remove(id) {
      const prev = await DB.get(name, id); if (!prev) return;
      await DB.put(name, { ...prev, deleted: true, updatedAt: now(), version: (prev.version || 0) + 1, syncStatus: 'pending' });
      await Outbox.enqueue(name, id, 'delete');
    }
  };
}
const Notes = Repository('notes');
const Events = Repository('events');
const Settings = {
  async get(key, fallback = null) { const r = await DB.get('settings', key); return r ? r.value : fallback; },
  set(key, value) { return DB.put('settings', { key, value }); }
};
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else document.documentElement.removeAttribute('data-theme');
}

/* =========================================================
   4. INTERFACE COMPARTILHADA (barra, folha, confirmação)
   ========================================================= */
const Topbar = {
  back: '#/',
  show(title, backHref) { $('#topbar').hidden = false; $('#topTitle').textContent = title; this.back = backHref; $('#topActions').innerHTML = ''; },
  hide() { $('#topbar').hidden = true; $('#topActions').innerHTML = ''; },
  setTitle(t) { $('#topTitle').textContent = t; },
  actions(html) { const a = $('#topActions'); a.innerHTML = html; return a; }
};
$('#backBtn').addEventListener('click', () => { location.hash = Topbar.back || '#/'; });

const Sheet = (() => {
  const back = $('#backdrop'), el = $('#sheet');
  let onClose = null, lastFocus = null, gen = 0;
  function open(html, opts = {}) {
    gen++;
    lastFocus = document.activeElement;
    el.innerHTML = '<div class="grab"></div>' + html;
    back.hidden = false; el.hidden = false;
    void el.offsetHeight;
    back.classList.add('open'); el.classList.add('open');
    onClose = opts.onClose || null;
    const f = el.querySelector('[autofocus]') || el.querySelector('button, input');
    setTimeout(() => f && f.focus({ preventScroll: true }), 80);
    return el;
  }
  function close() {
    if (el.hidden) return;
    const g = ++gen;
    back.classList.remove('open'); el.classList.remove('open');
    setTimeout(() => { if (g === gen) { back.hidden = true; el.hidden = true; el.innerHTML = ''; } }, 240);
    const cb = onClose; onClose = null; if (cb) cb();
    if (lastFocus && lastFocus.focus && document.body.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  back.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  return { open, close, get isOpen() { return !el.hidden && el.classList.contains('open'); } };
})();

function confirmSheet(title, detail, okLabel = 'Excluir') {
  return new Promise(res => {
    let done = false;
    const el = Sheet.open(`<h2>${esc(title)}</h2><p class="muted">${esc(detail)}</p>
      <div class="actions"><button class="btn grow" data-a="no">Cancelar</button><button class="btn danger-fill grow" data-a="ok">${esc(okLabel)}</button></div>`,
      { onClose: () => { if (!done) { done = true; res(false); } } });
    el.querySelector('[data-a=ok]').onclick = () => { done = true; res(true); Sheet.close(); };
    el.querySelector('[data-a=no]').onclick = () => Sheet.close();
  });
}

/* =========================================================
   5. PLATAFORMA — registro de módulos e rotas
   Para criar um módulo novo: Platform.register({ id, name,
   icon, colorVar, mount(view, params), unmount() }).
   A tela inicial e o roteador o reconhecem sozinhos.
   ========================================================= */
const Platform = {
  modules: new Map(),
  register(mod) {
    if (!mod.id || !mod.mount) throw new Error('Módulo precisa de id e mount()');
    if (this.modules.has(mod.id)) throw new Error('Módulo duplicado: ' + mod.id);
    this.modules.set(mod.id, mod);
  }
};
let current = null;
async function route() {
  if (location.hash && !location.hash.startsWith('#/')) return;   // retorno de login por e-mail
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const id = parts[0] || 'home';
  if (!$('#sheet').hidden) Sheet.close();
  if (current && current.unmount) { try { await current.unmount(); } catch (e) { console.error(e); } }
  current = null;
  const view = $('#view'); view.innerHTML = '';
  window.scrollTo(0, 0);
  const mod = id === 'home' ? Home : id === 'status' ? Status : id === 'profile' ? ProfileScreen : id === 'conta' ? AccountScreen : Platform.modules.get(id);
  if (!mod) { location.hash = '#/'; return; }
  current = mod;
  if (mod === Home) Topbar.hide(); else Topbar.show(mod.name, parts.length > 1 ? '#/' + parts[0] : '#/');
  try { await mod.mount(view, parts.slice(1)); }
  catch (e) {
    console.error(e);
    view.innerHTML = `<div class="empty"><p>Não foi possível abrir ${esc(mod.name)}.</p><p>${esc(e.message)}</p></div>`;
  }
}

/* =========================================================
   6. TELA INICIAL
   ========================================================= */
const FUTURE_MODULES = [['👥', 'Contatos'], ['📁', 'Arquivos'], ['🖼️', 'Galeria'], ['📷', 'Câmera'], ['🎙️', 'Gravador'], ['✅', 'Tarefas']];
const Home = {
  id: 'home', name: 'Início', timer: null,
  async mount(view) {
    const mods = [...Platform.modules.values()];
    view.innerHTML = `<section class="home">
      <div class="home-top"><a href="#/conta" aria-label="Minha conta">${avatar(Identity.profile || { name: '+' }, 'sm')}</a></div>
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
      <nav class="grid" aria-label="Aplicativos">
        ${mods.map(m => `<a class="tile" href="#/${m.id}" style="--tile:var(${m.colorVar})">
          <span class="ic" aria-hidden="true">${m.icon}${m.badge ? `<i class="badge">${esc(m.badge)}</i>` : ''}</span>
          <span>${esc(m.name)}</span></a>`).join('')}
        <button class="tile add" id="addMod"><span class="ic" aria-hidden="true">+</span><span>Adicionar</span></button>
      </nav>
      <section class="panel" aria-labelledby="todayH">
        <div class="panel-head"><h2 id="todayH">Hoje</h2><a href="#/calendar">Abrir calendário</a></div>
        <div id="today"></div>
      </section>
      <footer class="home-foot"><a href="#/status">Status do sistema</a><span id="engine"></span></footer>
    </section>`;
    const tick = () => {
      const d = new Date();
      $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      $('#date').textContent = cap(d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }));
    };
    tick(); this.timer = setInterval(tick, 10000);
    $('#addMod').addEventListener('click', () => {
      const el = Sheet.open(`<h2>Adicionar módulo</h2>
        <p class="muted">Estes módulos estão planejados. A plataforma já está preparada para recebê-los sem mexer no que existe.</p>
        <ul class="mod-list">${FUTURE_MODULES.map(([i, n]) => `<li><span class="mini-ic">${i}</span><span class="grow">${n}</span>${tag('future')}</li>`).join('')}</ul>
        <div class="actions"><button class="btn grow" id="closeAdd">Fechar</button></div>`);
      el.querySelector('#closeAdd').onclick = () => Sheet.close();
    });
    $('#engine').textContent = DB.engine === 'indexeddb' ? 'Dados salvos neste aparelho' : 'Modo temporário: nada será salvo';
    const unread = (await DB.all('messages')).filter(m => m.status === 'received').length;
    const msgIc = view.querySelector('a[href="#/messages"] .ic');
    if (unread && msgIc) msgIc.insertAdjacentHTML('beforeend', `<i class="badge n">${unread > 99 ? '99+' : unread}</i>`);
    const today = ymd(new Date());
    const evs = (await Events.list()).filter(e => e.date === today).sort(byTime);
    $('#today').innerHTML = evs.length
      ? evs.slice(0, 4).map(e => `<a class="today-ev" href="#/calendar/${today}"><time>${e.time || 'Dia todo'}</time><span>${esc(e.title)}</span></a>`).join('')
        + (evs.length > 4 ? `<p class="muted small">+${evs.length - 4} no calendário</p>` : '')
      : '<p class="muted" style="margin:0">Nada marcado para hoje.</p>';
  },
  unmount() { clearInterval(this.timer); }
};

/* =========================================================
   7. FASE 3 — CONTA, SERVIDOR (SUPABASE), SINCRONIZAÇÃO E MENSAGENS
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: 'https://lfzjzekquhomwxsavzdk.supabase.co',
  // Chave publicável: pode ficar no código. A proteção vem das regras RLS do banco.
  // NUNCA coloque aqui a chave secreta (sb_secret_...).
  SUPABASE_KEY: 'sb_publishable_i-h-YWU1o1aPMGc3n92TNw_UHJbUSdt'
};
const APP_VERSION = '3.2';                     // mostre esta versão em Status para conferir se o celular atualizou
const appUrl = () => location.origin + location.pathname;
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const iso = s => new Date(s).toISOString();

const Bus = {
  l: {},
  on(e, f) { (this.l[e] = this.l[e] || new Set()).add(f); return () => this.l[e].delete(f); },
  emit(e, d) { [...(this.l[e] || [])].forEach(f => { try { f(d); } catch (x) { console.error(x); } }); }
};
const randNum = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return String(1000 + (a[0] % 9000)); };
const parseTag = s => { const m = String(s || '').trim().match(/^(.+?)\s*#\s*(\d{4})$/); return m ? { name: m[1].trim(), number: m[2] } : null; };
const shortTime = v => { const d = new Date(v); return ymd(d) === ymd(new Date()) ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); };
function dayLabel(k) {
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (k === ymd(new Date())) return 'Hoje';
  if (k === ymd(y)) return 'Ontem';
  const [a, b, c] = k.split('-').map(Number);
  return new Date(a, b - 1, c).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
}
function avatar(p, size = '') {
  const cls = 'avatar' + (size ? ' ' + size : '');
  if (p && typeof p.photo === 'string' && p.photo.startsWith('data:image/')) return `<img class="${cls}" src="${esc(p.photo)}" alt="">`;
  const name = (p && p.name) || '?';
  const ini = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  const hues = ['#13897D', '#2F5BD3', '#C4385E', '#B07A10', '#6B4FC4', '#3E7D3A'];
  let h = 0; for (const ch of String((p && (p.userId || p.id)) || name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="${cls}" style="--av:${hues[h % hues.length]}" aria-hidden="true">${esc(ini)}</span>`;
}
function readPhoto(file, size = 192) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Escolha um arquivo de imagem.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Não foi possível ler essa imagem.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Formato de imagem não suportado.'));
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        let out = c.toDataURL('image/jpeg', 0.82);
        if (out.length > 58000) out = c.toDataURL('image/jpeg', 0.6);   // limite do banco: 60 mil caracteres
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function validName(n) {
  if (n.length < 2) return 'O nome precisa ter pelo menos 2 letras.';
  if (n.length > 30) return 'Use no máximo 30 caracteres.';
  if (n.includes('#')) return 'O nome não pode ter o símbolo #.';
  return '';
}

/* 7.1 Erros do servidor em linguagem simples -------------- */
class BackendError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
const ERR_TEXT = {
  SELF: 'Você não pode adicionar a si mesmo.', NOT_FOUND: 'Não encontrado. Pode já ter sido respondido.',
  ALREADY: 'Vocês já são contatos.', DUP: 'Você já enviou uma solicitação para essa pessoa.',
  REVERSE: 'Essa pessoa já te enviou uma solicitação. Aceite em Pedidos.', NOT_AUTH: 'Entre na sua conta de novo.'
};
function mapErr(e) {
  if (e instanceof BackendError) return e;
  const msg = String((e && e.message) || e || '');
  if (/failed to fetch|networkerror|load failed|network request|timeout/i.test(msg)) return new BackendError('NETWORK', 'Sem conexão com o servidor.');
  if (e && e.code === '23505') return new BackendError('TAG_TAKEN', 'Esse identificador já está em uso.');
  if ((e && e.code === 'PGRST301') || /jwt/i.test(msg)) return new BackendError('AUTH', 'Sua sessão expirou. Entre novamente.');
  if ((e && e.code === '42501') || /row-level security/i.test(msg)) return new BackendError('DENIED', 'Ação não permitida.');
  if (/does not exist|could not find the (table|function)|schema cache/i.test(msg)) return new BackendError('SCHEMA', 'O banco está desatualizado. Rode no Supabase o script SQL mais recente.');
  if (/bucket not found/i.test(msg)) return new BackendError('SCHEMA', 'A pasta de arquivos ainda não existe. Rode o SQL de arquivos no Supabase.');
  if (/exceeded the maximum|too large|payload/i.test(msg)) return new BackendError('FILE_TOO_BIG', 'Arquivo grande demais para o servidor.');
  const k = Object.keys(ERR_TEXT).find(x => msg.includes(x));
  if (k) return new BackendError(k, ERR_TEXT[k]);
  return new BackendError('SERVER', msg || 'Erro no servidor.');
}

/* 7.2 Cliente Supabase ------------------------------------ */
const Cloud = {
  sb: null, session: null, recovery: false,
  get user() { return this.session ? this.session.user : null; },
  init() {
    if (!window.supabase || !window.supabase.createClient) return false;
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    this.sb.auth.onAuthStateChange((ev, session) => {
      const before = this.user && this.user.id;
      this.session = session;
      if (ev === 'PASSWORD_RECOVERY') this.recovery = true;
      // setTimeout: não chamar o Supabase dentro deste callback (evita travamento)
      if (session && session.user.id !== before) setTimeout(() => Account.onLogin(session.user), 0);
      if (!session && before) setTimeout(() => Account.onLoggedOut(), 0);
      Bus.emit('auth', ev);
    });
    return true;
  },
  async q(builder) {
    let r;
    try { r = await builder; } catch (e) { throw mapErr(e); }
    if (r.error) throw mapErr(r.error);
    return r.data;
  }
};

/* 7.3 Servidor — mesma interface da Fase 2 ----------------- */
const NO_ACCOUNT_MSG = 'Entre na sua conta para usar o servidor.';
const NoServer = new Proxy({ id: 'none' }, {
  get(t, k) { return k in t ? t[k] : async () => { throw new BackendError('NO_BACKEND', NO_ACCOUNT_MSG); }; }
});

const CloudServer = {
  id: 'cloud',
  upsertUser(p) {
    return Cloud.q(Cloud.sb.from('profiles').upsert({ id: p.userId, name: p.name, number: p.number, photo: p.photo || '' }, { onConflict: 'id' }));
  },
  async findByTag(name, number) {
    const d = await Cloud.q(Cloud.sb.rpc('find_user', { p_name: name, p_number: number }));

  },
  sendRequest(fromId, toId) { return Cloud.q(Cloud.sb.rpc('send_request', { p_to: toId })); },
  respond(id, userId, accept) { return Cloud.q(Cloud.sb.rpc('respond_request', { p_id: id, p_accept: accept })); },
  cancel(id) { return Cloud.q(Cloud.sb.rpc('cancel_request', { p_id: id })); },
  async snapshot(userId) {
    const rs = await Cloud.q(Cloud.sb.from('contact_requests').select('id,from_id,to_id,status,created_at,responded_at').order('created_at', { ascending: false }).limit(500));
    const ids = [...new Set(rs.flatMap(r => [r.from_id, r.to_id]).filter(id => id !== userId))];
    const users = ids.length ? await Cloud.q(Cloud.sb.from('profiles').select('id,name,number,photo').in('id', ids)) : [];
    const map = new Map(users.map(u => [u.id, pub(u)]));
    if (Identity.profile) map.set(userId, pub({ ...Identity.profile, id: userId }));
    const requests = rs.map(r => ({ id: r.id, fromId: r.from_id, toId: r.to_id, status: r.status,
      createdAt: iso(r.created_at), respondedAt: r.responded_at ? iso(r.responded_at) : null, from: map.get(r.from_id), to: map.get(r.to_id) }));

  },
  async sendMessage(m) {
    let r;

    if (m.attachment) row.attachment = { name: m.attachment.name, size: m.attachment.size, type: m.attachment.type, path: m.attachment.path };
    try { r = await Cloud.sb.from('messages').insert(row); }

  async incoming(userId) {

  },
  async ackDelivered(ids) { if (ids.length) await Cloud.q(Cloud.sb.rpc('mark_delivered', { p_ids: ids })); },
  async receipts(ids) {
    const out = [];
    for (let i = 0; i < ids.length; i += 100)
      out.push(...await Cloud.q(Cloud.sb.from('messages').select('id,delivered_at,read_at').in('id', ids.slice(i, i + 100))));
    return out.map(r => ({ id: r.id, deliveredAt: r.delivered_at, readAt: r.read_at }));
  },
  markRead(userId, peerId) { return Cloud.q(Cloud.sb.rpc('mark_read', { p_peer: peerId })); },
  async upload(path, blob, type) {

    if (r.error && !/exist|duplicate|409/i.test(String(r.error.message) + ' ' + (r.error.statusCode || ''))) throw mapErr(r.error);   // já enviado antes = ok
  },
  async download(path) {
    let r;
    try { r = await Cloud.sb.storage.from('attachments').download(path); } catch (e) { throw mapErr(e); }
    if (r.error) throw mapErr(r.error);
    return r.data;
  },
  history() {
    return Cloud.q(Cloud.sb.from('messages').select('id,sender_id,recipient_id,body,created_at,delivered_at,read_at,attachment')
      .order('server_at', { ascending: false }).limit(500));
  }
};
const Backend = {
  current() { return Cloud.user ? CloudServer : NoServer; },
  get available() { return !!(Cloud.sb && Cloud.user); }
};

/* 7.5 Tempo real: o servidor avisa, o app sincroniza ------- */
const Realtime = {
  ch: null, live: false,
  start(uid) {
    this.stop();
    if (!Cloud.sb) return;
    const go = () => Sync.soon();
    this.ch = Cloud.sb.channel('nucleo-' + uid)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'recipient_id=eq.' + uid }, go)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: 'sender_id=eq.' + uid }, go)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'contact_requests' }, go)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'notes', filter: 'user_id=eq.' + uid }, go)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'events', filter: 'user_id=eq.' + uid }, go)
      .subscribe(status => { this.live = status === 'SUBSCRIBED'; Bus.emit('conn'); });
  },
  stop() { if (this.ch && Cloud.sb) Cloud.sb.removeChannel(this.ch); this.ch = null; this.live = false; }
};

/* 7.6 Notificações (Web: app aberto ou em segundo plano) --- */
const Notifier = {
  get supported() { return 'Notification' in window && 'serviceWorker' in navigator; },
  get state() { return this.supported ? Notification.permission : 'unsupported'; },
  async ask() { return this.supported ? Notification.requestPermission() : 'unsupported'; },
  async messages(list) {
    if (this.state !== 'granted' || !list.length) return;
    const reg = await navigator.serviceWorker.getRegistration(); if (!reg) return;
    const openPeer = decodeURIComponent((location.hash.match(/^#\/messages\/chat\/([^/]+)/) || [])[1] || '');
    const names = new Map((await DB.all('contacts')).map(c => [c.id, c.name]));
    const byPeer = new Map();
    for (const m of list) byPeer.set(m.peer, [...(byPeer.get(m.peer) || []), m]);
    for (const [peer, ms] of byPeer) {
      if (!document.hidden && openPeer === peer) continue;
      reg.showNotification(names.get(peer) || 'Nova mensagem', {
        body: ms.length > 1 ? `${ms.length} novas mensagens` : msgPreview(ms[ms.length - 1]).slice(0, 140),
        tag: 'msg-' + peer, renotify: true, data: { url: '#/messages/chat/' + encodeURIComponent(peer) }
      });
    }
  }
};

/* 7.8 Conta: entrar, sair, trocar de conta ----------------- */
async function wipeUserData() {
  for (const n of ['notes', 'events', 'outbox', 'contacts', 'requests', 'messages', 'files']) await DB.clear(n);
  for (const k of ['profile', 'cloudUserId', 'pull:notes', 'pull:events', 'msgBackfilled']) await DB.del('settings', k);
  Identity.profile = null;
}
const Account = {
  async onLogin(user) {
    try {
      const prev = await Settings.get('cloudUserId');
      if (prev !== user.id) {
        if (prev) await wipeUserData();               // outra conta usou este aparelho
        for (const n of ['contacts', 'requests', 'messages', 'files', 'sim_users', 'sim_requests', 'sim_messages']) await DB.clear(n);
        for (const k of ['pull:notes', 'pull:events', 'msgBackfilled']) await DB.del('settings', k);
        // notas e eventos criados antes de entrar passam a ser desta conta
        for (const s of ['notes', 'events']) for (const r of await DB.all(s)) await Outbox.enqueue(s, r.id, r.deleted ? 'delete' : 'upsert');
        await Settings.set('cloudUserId', user.id);
      }
      await Identity.fromCloud(user);
      Realtime.start(user.id);
      Sync.soon();
    } catch (e) { console.error(e); toast(mapErr(e).message); }
    Bus.emit('auth', 'APP_LOGIN');
  },
  onLoggedOut() { Realtime.stop(); Bus.emit('auth', 'APP_LOGOUT'); },
  async logout() {
    const pending = await Outbox.count() + (await DB.all('messages')).filter(m => m.status === 'pending' || m.status === 'sending').length;
    const detail = pending
      ? `Há ${pending} alteração(ões) ainda não enviada(s) ao servidor. Se sair agora, elas serão perdidas.`
      : 'Os dados deste aparelho serão apagados. O que já está na nuvem volta quando você entrar de novo.';
    if (!(await confirmSheet('Sair da conta?', detail, 'Sair'))) return;
    Realtime.stop();
    try { await Cloud.sb.auth.signOut({ scope: 'local' }); } catch (e) { console.error(e); }
    Cloud.session = null;
    await wipeUserData();
    toast('Você saiu da conta');
    if (location.hash === '#/conta') route(); else location.hash = '#/conta';
  }
};

/* 7.9 Sincronização --------------------------------------- */
const RANK = { pending: 0, failed: 0, sending: 1, sent: 2, delivered: 3, read: 4 };
const NOTE_FIELDS = ['title', 'body', 'category', 'favorite'];
const EVENT_FIELDS = ['title', 'description', 'date', 'time', 'reminder'];
function toRow(table, r) {
  const row = { id: r.id, created_at: r.createdAt, updated_at: r.updatedAt, version: r.version || 1, device_id: r.deviceId || null, deleted: !!r.deleted };
  if (table === 'notes') { row.title = r.title || ''; row.body = r.body || ''; row.category = r.category || ''; row.favorite = !!r.favorite; }
  else { row.title = r.title || 'Sem título'; row.description = r.description || ''; row.date = r.date; row.time = r.time || ''; row.reminder = String(r.reminder ?? ''); }
  return row;
}
function fromRow(table, row) {
  const r = { id: row.id, createdAt: iso(row.created_at), updatedAt: iso(row.updated_at), version: row.version, deviceId: row.device_id, deleted: !!row.deleted, syncStatus: 'synced' };
  for (const f of (table === 'notes' ? NOTE_FIELDS : EVENT_FIELDS)) r[f] = row[f];
  return r;
}
const Sync = {
  busy: false, again: false, t: null, lastError: null, lastSync: null,
  soon(ms = 150) { clearTimeout(this.t); this.t = setTimeout(() => this.run(), ms); },
  async ensureRegistered() {
    const me = Identity.profile; if (!me || me.registered || !Cloud.user) return;
    for (let i = 0; i < 6; i++) {
      try { await CloudServer.upsertUser(me); me.registered = true; await Settings.set('profile', me); Bus.emit('profile'); return; }
      catch (e) {
        if (e.code !== 'TAG_TAKEN') throw e;
        me.number = randNum(); await Settings.set('profile', me);
        toast('Seu número já estava em uso e virou #' + me.number);
      }
    }
  },
  async run() {
    if (this.busy) { this.again = true; return; }
    if (!Cloud.user || !Connection.internet()) return;
    this.busy = true;
    let changed = false;
    try {
      changed = (await this.pushRecords()) || changed;
      changed = (await this.pullRecords('notes')) || changed;
      changed = (await this.pullRecords('events')) || changed;
      if (Identity.profile) { await this.ensureRegistered(); await this.syncMessages(); }
      this.lastError = null; this.lastSync = now();
    } catch (e) {
      const x = mapErr(e); console.error(e);
      this.lastError = x.code === 'NETWORK' ? null : x.message;
    } finally {
      this.busy = false;
      if (changed) Bus.emit('data');
      Bus.emit('sync');
      if (this.again) { this.again = false; this.soon(); }
    }
  },
  // Envia notas/eventos alterados (fila "outbox")
  async pushRecords() {
    let changed = false;
    for (const o of await DB.all('outbox')) {
      if (o.entity !== 'notes' && o.entity !== 'events') continue;
      const rec = await DB.get(o.entity, o.entityId);
      if (!rec || !UUID_RE.test(rec.id)) { await DB.del('outbox', o.id); continue; }
      try { await Cloud.q(Cloud.sb.from(o.entity).upsert(toRow(o.entity, rec), { onConflict: 'id' })); }
      catch (e) { if (e.code === 'NETWORK' || e.code === 'AUTH' || e.code === 'SCHEMA') throw e; console.error(e); continue; }
      const cur = await DB.get(o.entity, rec.id);
      if (cur && cur.updatedAt === rec.updatedAt) { await DB.put(o.entity, { ...cur, syncStatus: 'synced' }); changed = true; }
      const ob = await DB.get('outbox', o.id);
      if (ob && ob.queuedAt === o.queuedAt) await DB.del('outbox', o.id);   // não apaga uma edição mais nova
    }
    return changed;
  },
  // Baixa o que mudou na nuvem desde a última vez (a versão mais recente vence)
  async pullRecords(table) {
    const key = 'pull:' + table;
    let since = await Settings.get(key, '1970-01-01T00:00:00Z'), changed = false;
    for (let page = 0; page < 25; page++) {
      const rows = await Cloud.q(Cloud.sb.from(table).select('*').gt('server_updated_at', since).order('server_updated_at').limit(200));
      for (const row of rows) {
        const remote = fromRow(table, row), local = await DB.get(table, row.id);
        if (!local || Date.parse(remote.updatedAt) > Date.parse(local.updatedAt)) { await DB.put(table, remote); changed = true; }
        since = row.server_updated_at;
      }
      await Settings.set(key, since);
      if (rows.length < 200) break;
    }
    return changed;
  },
  async syncMessages() {
    const me = Identity.profile, api = CloudServer;
    // 0. aparelho novo: baixa o histórico recente uma vez
    if ((await Settings.get('msgBackfilled')) !== 2) {
      for (const r of await api.history()) {
        const local = await DB.get('messages', r.id);
        if (local) {                                    // versão antiga salvou sem o anexo: completa agora
          if (r.attachment && !local.attachment) await DB.put('messages', { ...local, attachment: { ...r.attachment, uploaded: true } });
          continue;
        }
        const mine = r.sender_id === me.userId;
        await DB.put('messages', { id: r.id, peer: mine ? r.recipient_id : r.sender_id, from: r.sender_id, to: r.recipient_id, body: r.body,
          attachment: r.attachment ? { ...r.attachment, uploaded: true } : null,
          createdAt: iso(r.created_at), channel: 'online', readSynced: true,
          status: mine ? (r.read_at ? 'read' : r.delivered_at ? 'delivered' : 'sent') : (r.read_at ? 'read' : 'received') });
      }
      await Settings.set('msgBackfilled', 2);
    }
    // 1. envia pendentes (inclui as que ficaram "enviando" se o app fechou no meio)
    const out = (await DB.all('messages')).filter(m => m.from === me.userId && (m.status === 'pending' || m.status === 'sending'))
      .sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    for (const m of out) {
      await DB.put('messages', { ...m, status: 'sending', channel: 'online' }); Bus.emit('messages');
      try {
        if (m.attachment && !m.attachment.uploaded) {           // 1º o arquivo, depois a mensagem
          const f = await DB.get('files', m.id);
          if (!f) throw new BackendError('NO_FILE', 'O arquivo não está mais neste aparelho.');
          await api.upload(m.attachment.path, f.blob, m.attachment.type);
          m.attachment = { ...m.attachment, uploaded: true };
          await DB.put('messages', { ...m, status: 'sending', channel: 'online' });
        }
        await api.sendMessage(m); await DB.put('messages', { ...m, status: 'sent', channel: 'online', error: null });
      }
      catch (e) {
        const x = mapErr(e);
        if (x.code === 'NETWORK' || x.code === 'AUTH' || x.code === 'SCHEMA') { await DB.put('messages', { ...m, status: 'pending' }); throw x; }
        await DB.put('messages', { ...m, status: 'failed', error: x.message });
      }
    }
    // 2. confirma leituras feitas enquanto estava sem conexão
    const readPeers = new Set((await DB.all('messages')).filter(m => m.from !== me.userId && m.status === 'read' && m.readSynced === false).map(m => m.peer));
    for (const peer of readPeers) {
      await api.markRead(me.userId, peer);
      for (const m of await DB.byIndex('messages', 'peer', peer)) if (m.readSynced === false) await DB.put('messages', { ...m, readSynced: true });
    }
    // 3. recebe novas mensagens: salva no aparelho ANTES de confirmar a entrega
    const inc = await api.incoming(me.userId), fresh = [];
    for (const im of inc) {
      if (await DB.get('messages', im.id)) continue;
      const rec = { ...im, peer: im.from, status: 'received', channel: 'online' };
      await DB.put('messages', rec); fresh.push(rec);
    }
    await api.ackDelivered(inc.map(m => m.id));
    // 4. recibos das minhas mensagens (entregue / lida)
    const watch = (await DB.all('messages')).filter(m => m.from === me.userId && (m.status === 'sent' || m.status === 'delivered')).map(m => m.id);
    for (const r of await api.receipts(watch)) {
      const m = await DB.get('messages', r.id); if (!m) continue;
      const st = r.readAt ? 'read' : r.deliveredAt ? 'delivered' : m.status;
      if ((RANK[st] ?? 0) > (RANK[m.status] ?? 0)) await DB.put('messages', { ...m, status: st });
    }
    // 5. contatos e solicitações (cópia local para ver sem internet)
    const snap = await api.snapshot(me.userId);
    await DB.clear('contacts'); for (const c of snap.contacts) await DB.put('contacts', { ...c, syncedAt: now() });
    await DB.clear('requests'); for (const r of snap.requests) await DB.put('requests', r);
    if (fresh.length) Notifier.messages(fresh);
  },
  start() {
    setInterval(() => { if (document.visibilityState === 'visible') this.run(); }, 20000);   // reserva caso o tempo real caia
    this.run();
  }
};

const Messenger = {
  async send(peerId, body) {
    const me = Identity.profile;
    const m = { id: uid(), peer: peerId, from: me.userId, to: peerId, body, createdAt: now(), status: 'pending', channel: null };
    await DB.put('messages', m); Bus.emit('messages'); Sync.soon(); return m;
  },
  async sendFile(peerId, file, caption) {
    const me = Identity.profile;
    if (file.size > MAX_FILE) throw new Error(`“${file.name}” passa de ${fmtBytes(MAX_FILE)}.`);
    let blob = file, name = file.name || 'arquivo', type = file.type || 'application/octet-stream';
    if (/^image\/(jpeg|png|webp)$/.test(type) && file.size > 350 * 1024) {
      try { const small = await shrinkImage(file); if (small.size < file.size) { blob = small; type = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; } }
      catch (e) { console.warn('Foto enviada sem reduzir', e); }
    }
    const id = uid();
    const safe = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').slice(-80) || 'arquivo';
    await DB.put('files', { id, blob, type, name });                 // guarda no aparelho: funciona offline
    const m = { id, peer: peerId, from: me.userId, to: peerId, body: String(caption || '').trim(), createdAt: now(), status: 'pending', channel: null,
      attachment: { name, size: blob.size, type, path: `${me.userId}/${id}/${safe}`, uploaded: false } };
    await DB.put('messages', m); Bus.emit('messages'); Sync.soon(); return m;
  },
  async retry(id) {
    const m = await DB.get('messages', id);
    if (m && m.status === 'failed') { await DB.put('messages', { ...m, status: 'pending', error: null }); Bus.emit('messages'); Sync.soon(); }
  },
  async markConversationRead(peerId) {
    let changed = false;
    for (const m of await DB.byIndex('messages', 'peer', peerId))
      if (m.from === peerId && m.status === 'received') { await DB.put('messages', { ...m, status: 'read', readSynced: false }); changed = true; }
    if (changed) Sync.soon();
  }
};

const Viewer = {
  el: null,
  open(url, name) {
    this.remove();
    const el = document.createElement('div');
    el.className = 'fviewer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', name || 'Imagem');
    el.innerHTML = `<div class="fv-bar"><button class="fv-btn" data-fv="close" aria-label="Fechar">✕</button><span class="fv-name">${esc(name || '')}</span><button class="fv-btn" data-fv="save" aria-label="Baixar imagem">${ICON.download}</button></div>
      <div class="fv-stage"><img class="fit" src="${url}" alt="${esc(name || '')}"></div>`;
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    history.pushState({ fviewer: true }, '');          // botão Voltar do Android fecha a imagem
    this.el = el;
    const stage = el.querySelector('.fv-stage');
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-fv]');
      if (b) { if (b.dataset.fv === 'save') saveFile(url, name); else this.close(); return; }
      if (e.target.tagName === 'IMG') {                 // toque na imagem: aproxima / afasta
        const img = e.target;
        if (img.classList.contains('fit')) {
          const rx = e.offsetX / img.clientWidth, ry = e.offsetY / img.clientHeight;
          img.className = 'full'; stage.classList.add('zoomed');
          stage.scrollLeft = rx * img.naturalWidth - stage.clientWidth / 2;
          stage.scrollTop = ry * img.naturalHeight - stage.clientHeight / 2;
        } else { img.className = 'fit'; stage.classList.remove('zoomed'); }
        return;
      }
      if (e.target === stage) this.close();              // toque fora da imagem fecha
    });
    el.querySelector('[data-fv=close]').focus();
  },
  close() { if (this.el) history.back(); },
  remove() { if (this.el) { this.el.remove(); this.el = null; document.body.style.overflow = ''; } }
};
window.addEventListener('popstate', () => Viewer.remove());

const kindOf = t => /^image\/(jpeg|png|webp|gif)$/.test(t || '') ? 'image' : /^video\//.test(t || '') ? 'video' : /^audio\//.test(t || '') ? 'audio' : 'file';
function msgPreview(m) {
  if (!m.attachment) return m.body;
  const k = kindOf(m.attachment.type);
  const label = k === 'image' ? '📷 Foto' : k === 'video' ? '🎬 Vídeo' : k === 'audio' ? '🎵 Áudio' : '📎 ' + m.attachment.name;
  return m.body ? `${label}: ${m.body}` : label;
}
function shrinkImage(file, max = 1600) {      // reduz fotos grandes antes de enviar
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('imagem'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? res(b) : rej(new Error('imagem')), 'image/jpeg', 0.85);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function saveFile(url, name) {
  const a = document.createElement('a'); a.href = url; a.download = name || 'arquivo';
  document.body.appendChild(a); a.click(); a.remove();
}
